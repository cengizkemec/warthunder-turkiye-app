<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wttr-app Voice Overlay</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div class="overlay-card" id="overlay-card">
      <header class="overlay-header" id="overlay-header">
        <span class="room-dot" id="room-dot"></span>
        <div class="room-copy">
          <strong id="room-name">Sesli Oda</strong>
          <span id="room-meta">Bağlantı yok</span>
        </div>
        <span class="collapsed-live" id="collapsed-live"></span>
        <div class="header-actions">
          <button class="icon-button" id="overlay-collapse" type="button" title="Daralt">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
          </button>
          <button class="icon-button" id="overlay-hide" type="button" title="Overlay'i gizle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
      </header>

      <div class="overlay-body" id="overlay-body">
        <div class="participants" id="participants"></div>
        <div class="empty" id="empty">Sesli odaya katılınca katılımcılar burada görünür.</div>
      </div>

      <footer class="overlay-footer" id="overlay-footer">
        <div class="ptt-pill" id="ptt-pill">
          <span class="ptt-dot"></span>
          <span id="ptt-label">PTT: Alt</span>
        </div>
        <div class="controls">
          <button class="control" id="mic" type="button" title="Mikrofon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3" />
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6" />
            </svg>
          </button>
          <button class="control" id="deafen" type="button" title="Sağırlaştır">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 14v-2a8 8 0 0 1 16 0v2" />
              <rect x="3" y="13" width="4" height="7" rx="2" />
              <rect x="17" y="13" width="4" height="7" rx="2" />
              <path d="M4 4l16 16" />
            </svg>
          </button>
          <button class="control" id="open" type="button" title="Uygulamayı aç">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 5h5v5M19 5l-8 8" />
              <path d="M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
            </svg>
          </button>
          <button class="control danger" id="leave" type="button" title="Odadan ayrıl">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v9" />
              <path d="M7.5 6.5a8 8 0 1 0 9 0" />
            </svg>
          </button>
        </div>
      </footer>
    </div>

    <script src="overlay.js"></script>
  </body>
</html>
