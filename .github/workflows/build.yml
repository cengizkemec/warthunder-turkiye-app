name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          node node_modules/electron/install.js

      - name: Build push-to-talk helper
        run: cargo build --release --manifest-path ptt-helper/Cargo.toml

      - name: Build installer
        run: npx electron-builder --win nsis
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Write installer SHA-256
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter "wttr-app-Setup-*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ASCII "$($_.FullName).sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: wttr-app-installer
          path: |
            dist/*.exe
            dist/*.sha256
