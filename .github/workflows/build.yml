name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          node node_modules/electron/install.js

      - name: Build push-to-talk helper
        run: cargo build --release --manifest-path ptt-helper/Cargo.toml

      - name: Package application
        run: npx electron-builder --win dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 7\ISCC.exe",
            "C:\Program Files\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $iscc) {
            throw "ISCC.exe not found"
          }

          & $iscc "/DSourceDir=..\dist\win-unpacked" "installer\wttr-app.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Write installer SHA-256
        shell: pwsh
        run: |
          Get-ChildItem dist-installer -Filter "wttr-app-Setup-*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ASCII "$($_.FullName).sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: wttr-app-installer
          path: |
            dist-installer/*.exe
            dist-installer/*.sha256
          if-no-files-found: error
