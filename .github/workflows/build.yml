name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri application
        run: npm run tauri build

      - name: Prepare WebView2 loader
        shell: pwsh
        run: |
          $loader = Get-ChildItem "src-tauri/target/release/build" -Recurse -Filter "WebView2Loader.dll" |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Select-Object -First 1

          if ($loader) {
            Copy-Item $loader.FullName "src-tauri/target/release/WebView2Loader.dll" -Force
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe", "C:\Program Files\Inno Setup*\ISCC.exe" |
            Select-Object -First 1

          if (-not $iscc) {
            throw "ISCC.exe bulunamadı"
          }

          & $iscc.FullName "installer\warthunder-tr.iss"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: warthunder-turkiye-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist-installer/*.exe
          if-no-files-found: error
